<script>
var excerpts = [
{"chapter":"Chapter 1: Two Dead Economists and the Invisible Landlord","text":"His name was Henry George. The crowds came because he had told them something strange and unsettling: that their poverty had a mechanism, and the mechanism had been running, invisibly, since before they were born."},
{"chapter":"Chapter 1: Two Dead Economists and the Invisible Landlord","text":"George\u2019s radicalization of Ricardo was simple and devastating. Ricardo had described rent as a technical feature of agricultural markets. George said it was the central injustice of civilization. Every advance in technology, every improvement in public infrastructure, every increase in population density made land more valuable \u2014 and that value flowed automatically to whoever held the deed. The landlord class did not need to conspire. They did not need to lobby. They just needed to wait. Progress itself was their business model."},
{"chapter":"Chapter 1: Two Dead Economists and the Invisible Landlord","text":"He ran again in 1897 \u2014 the campaign that killed him. And then he was forgotten. His books went out of print. His ideas vanished from university curricula. The landlords did not need to argue against George. They just needed to wait him out. They were good at waiting. It was, after all, their only skill."},
{"chapter":"Chapter 1: Two Dead Economists and the Invisible Landlord","text":"She does not think of herself as paying rent to a landlord class. She thinks of herself as paying bills. That is the point. Rent works best when nobody calls it rent."},
{"chapter":"Chapter 2: The Generation That Arrived Late","text":"In 1975, a 25-year-old with a high school diploma and a factory job could buy a three-bedroom house in Levittown, Pennsylvania, for $37,000. His salary was roughly $12,000. The price-to-income ratio was about 3:1. That house is worth $380,000 in 2025. His granddaughter, a 25-year-old with a bachelor\u2019s degree and $28,000 in student loans, earns $42,000 a year as an administrative coordinator. The price-to-income ratio is now 9:1. She cannot buy her grandfather\u2019s house. She cannot buy any house."},
{"chapter":"Chapter 2: The Generation That Arrived Late","text":"The GI Bill did not create racial inequality from scratch. But it took the existing gap and welded it to the most powerful wealth-building mechanism the country had ever produced: leveraged, tax-advantaged, federally subsidized land ownership. One group got on the escalator at the ground floor. The other group was told the escalator was whites-only."},
{"chapter":"Chapter 2: The Generation That Arrived Late","text":"Sarah and Maria have the same degree from the same university. They work at the same company. They earn within $3,000 of each other. Sarah will become a homeowner through inheritance. Maria will rent for the foreseeable future \u2014 paying land rent to whoever owns the building where she lives, transferring wealth upward every month, falling further behind with every passing year."},
{"chapter":"Chapter 2: The Generation That Arrived Late","text":"This is not a conspiracy. No one designed it. But it is a system, and like all systems, it produces predictable outcomes. The outcome it produces is a permanent renter class: educated, employed, productive people who will never accumulate wealth because the land beneath their feet belongs to someone else."},
{"chapter":"Chapter 3: J.K. Rowling: What It Feels Like to Be Poor","text":"Strip the ending away. Forget everything that came after. Between 1993 and 1997, JK was a person who could not afford heating, who counted coins at the supermarket, who sat across from benefits clerks and answered questions about why she deserved to eat. She was not a future billionaire. She was a woman who described herself as \u201cthe biggest failure I knew.\u201d That is the person this chapter is about."},
{"chapter":"Chapter 3: J.K. Rowling: What It Feels Like to Be Poor","text":"This performance \u2014 the performance of solvency \u2014 is the part of poverty that Census tables do not record. It is not material deprivation, though it accompanies material deprivation. It is the continuous, exhausting management of other people\u2019s perceptions. You dress slightly better than you can afford. You mention plans you will never carry out. You do not explain why you declined the invitation; you imply a scheduling conflict."},
{"chapter":"Chapter 3: J.K. Rowling: What It Feels Like to Be Poor","text":"She was there because her flat was too cold. She could not afford to run the heating during the day. The cafe was cheaper than the electricity bill. For the price of a single espresso, she got heat, light, a chair, a table, and permission to sit for hours without anyone asking her to leave. The staff let her stay. She wrote longhand on legal pads while her daughter slept in a pram beside her."},
{"chapter":"Chapter 4: Platform Feudalism","text":"In feudal England, the lord owned the land. The peasant worked it. The lord contributed nothing to the harvest \u2014 no seed, no sweat, no skill. He simply owned the thing you had to stand on to do your work. His revenue came from the fact of ownership, not the act of production. Replace \u201cland\u201d with \u201calgorithm.\u201d Replace \u201clord\u201d with \u201cplatform.\u201d Replace \u201cpeasant\u201d with \u201cindependent contractor.\u201d The economics have not changed. The vocabulary has."},
{"chapter":"Chapter 4: Platform Feudalism","text":"This is the feudal arithmetic rendered in decimal. The worker supplies the capital. The worker supplies the labor. The worker bears the risk. The platform supplies the marketplace and extracts rent for the privilege of participation."},
{"chapter":"Chapter 4: Platform Feudalism","text":"The result is a workforce that looks, on paper, like a population of entrepreneurs. Sixty-four million Americans \u201crunning their own businesses.\u201d The language flatters. The reality is that most of these workers are selling labor at prices they do not set, on terms they did not negotiate, through channels they do not control, to a platform that extracts rent automatically and can terminate their access without cause."},
{"chapter":"Chapter 5: The Coffee Shop Economy","text":"The workers stopped showing up. The trains run emptier. The restaurants closed. And the owners are learning, expensively, what George could have told them in 1879: they never created the value. They held the deed while everyone else created it. Now that everyone else has rearranged, the deed is worth what the owner contributed all along \u2014 which is nothing, plus the cost of the concrete."},
{"chapter":"Chapter 5: The Coffee Shop Economy","text":"For eight dollars, the remote worker receives: a handcrafted espresso drink, four hours of workspace, WiFi, electrical outlets, climate control, ambient social stimulus, the sound of other humans working, and \u2014 critically \u2014 permission to occupy space. The cafe is not selling coffee. It is selling the right to be somewhere, to sit in a chair at a table in a room with other people, for a period of time sufficient to do meaningful work."},
{"chapter":"Chapter 5: The Coffee Shop Economy","text":"The nomad\u2019s bargain is the local worker\u2019s eviction notice. And the landlord collects on both sides."},
{"chapter":"Chapter 5: The Coffee Shop Economy","text":"There is a specific emotional texture to realizing that your presence makes a place more expensive and that you cannot afford to stay. You helped build the thing that priced you out. Your taste, your labor, your social energy, your willingness to show up and make the neighborhood vibrant \u2014 all of it was converted into land value, and the land value was captured by someone else."},
{"chapter":"Chapter 6: The Body Tax","text":"The American healthcare system is a series of chokepoints \u2014 hospital systems, pharmacy benefit managers, insurance networks \u2014 each one controlled by a consolidated entity that sits between the patient and the care the patient needs, extracting a fee for passage. The patient provides the body, the illness, and the willingness to pay. The system provides access. And the access fee rises not because care improves but because the chokepoints consolidate."},
{"chapter":"Chapter 6: The Body Tax","text":"The chain has a feature that Ricardo\u2019s landlord lacked. Ricardo\u2019s tenant could, in theory, move to less productive land. The patient cannot opt out of having a body."},
{"chapter":"Chapter 6: The Body Tax","text":"One hundred million Americans \u2014 roughly 41% of adults \u2014 carry medical debt. The total exceeds $220 billion. Medical debt is the leading cause of personal bankruptcy in the United States, a distinction it has held for two decades. Unlike a mortgage, medical debt buys no asset. Unlike a student loan, it reflects no choice. A person does not decide to have appendicitis. The debt arrives because the body failed and the system charged for the repair."},
{"chapter":"Chapter 7: The Phenomenology of Broke","text":"All three accounts converge on the same insight. Poverty is not primarily a lack of money. It is a mode of existence. It is a way of inhabiting time \u2014 always behind, always calculating, always performing. The broke person does not experience the present. The broke person experiences a rolling series of deadlines: when is rent due, when does the benefit land, when does the phone get cut off, when does the school need the fee for the trip that every other child is going on."},
{"chapter":"Chapter 7: The Phenomenology of Broke","text":"A woman at a gas station counter in Cleveland, counting coins out of a Ziploc bag. Quarters first. Then dimes. Then nickels. The line behind her shifting weight. The cashier waiting. The fluorescent light buzzing. She needs $4.12 for a gallon of milk and a box of cereal. She has $3.87. She puts back the cereal. She takes the milk. She walks to the bus stop. The bus is eleven minutes late. She stands there."},
{"chapter":"Chapter 7: The Phenomenology of Broke","text":"The angry know that they are working harder and falling behind. They are correct. Real wages for non-supervisory workers in the United States were essentially flat from 1979 to 2019, while productivity nearly doubled. The gap between what workers produced and what workers kept did not vanish. It was captured \u2014 by landowners through rising property values, by shareholders through stock buybacks, by platform companies through algorithmic toll-taking, and by credentialing institutions through tuition that functions as a license fee for entry into the middle class."},
{"chapter":"Chapter 8: The Psychology of Rage","text":"Averill\u2019s alternative changes everything that follows. Anger, he argued, is not a reflex. It is a judgment. The distinction matters enormously. If anger is a judgment, then the anger coursing through American politics right now is data. It is millions of people, independently, reaching the same verdict: something has been done to us that should not have been done."},
{"chapter":"Chapter 8: The Psychology of Rage","text":"You cannot punch an algorithm. You cannot vote against differential rent. You cannot march on a benefit withdrawal trap. So the anger finds substitute targets. The anger is real. The target is often wrong. Not because the angry are stupid, but because the actual cause has been engineered to be invisible."},
{"chapter":"Chapter 8: The Psychology of Rage","text":"The internalization of structural failure as personal shame is not a bug in American culture. It is the load-bearing wall. It is what keeps people running on the treadmill instead of asking who owns the treadmill and why they are charged admission to use it."},
{"chapter":"Chapter 9: Two Different Cages","text":"In the American masculine script, financial provision is not something a man does. It is something a man is. The provider role functions as an identity claim. A man who provides is a man. A man who cannot provide is \u2014 in the logic of the script \u2014 not quite a man. This means that financial failure for a man socialized in American masculine norms is not experienced as a misfortune. It is experienced as evidence of who he is."},
{"chapter":"Chapter 9: Two Different Cages","text":"Anger offers a different door. Anger reframes. I am not weak \u2014 I am wronged. I am not a failure \u2014 I have been failed. I am not inadequate \u2014 I have been cheated. The reframe is not a lie. It is, in fact, partially correct. The man has been cheated. Ricardo\u2019s rent is real. The platform toll is real. The mortgage trap is real. The wealth was extracted. The game was rigged. He is right that there was an injustice. He is often wrong about who committed it."},
{"chapter":"Chapter 9: Two Different Cages","text":"A politician who says \u201cthe rent-seeking structure of the American economy has systematically transferred socially created land value from workers to asset holders through mechanisms first described by David Ricardo in 1817\u201d is making an accurate statement. He is also losing the election. A politician who says \u201cthey are taking what is yours\u201d wins. The pronoun does all the work."},
{"chapter":"Chapter 10: The Fix","text":"The diagnosis took nine chapters. The prescription takes one. Not because the solution is simple, but because the solution has been known since 1879 and the obstacles to implementing it are political, not intellectual. George did not just describe the disease. He prescribed the cure. Tax the land. Untax the labor. Return the socially created value to the society that created it."},
{"chapter":"Chapter 10: The Fix","text":"The current system taxes the first dollar of wages at 15.3% while taxing capital gains at preferential rates and land appreciation at near-zero effective rates. This is upside-down. The worker who creates value is taxed the most. The landowner who captures value is taxed the least."},
{"chapter":"Chapter 10: The Fix","text":"Outrage is a resource. Organization is the machine that converts it into law."},
{"chapter":"Chapter 11: Epilogue","text":"An estimated 100,000 people filed past George\u2019s coffin at the Grand Central Palace. The funeral procession stretched for miles. Working people came \u2014 longshoremen, garment workers, clerks, drivers. They came because George had told them something that no other economist had been willing to say plainly: that their poverty was not their fault, that it was produced by a mechanism, and that the mechanism had a name and an address."},
{"chapter":"Chapter 11: Epilogue","text":"It is running right now, at 2:00 a.m., in the glow of a phone screen. A gig worker \u2014 let us say she is thirty-one, let us say she drives in Phoenix, let us say her name does not matter because there are millions of her \u2014 checks the app for the next fare. The fare will pay $11.40. The platform will take $4.20. Her landlord will take $1,650 on the first of the month. She is tired. She is angry. She does not know the name Ricardo. She has never heard of Henry George. But she is living inside the mechanism they described, and it is extracting from her, silently, automatically, in the dark."},
{"chapter":"Chapter 11: Epilogue","text":"The crowds still come. They come to rallies and to ballot boxes and to the comment sections of articles they cannot finish reading because the paywall is itself a rent. They come angry. They come broke. They come looking for someone to blame. What they deserve \u2014 what this book has tried to provide \u2014 is not a target for their rage but a map of the extraction."}
